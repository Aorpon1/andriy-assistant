<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0a1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Андрій AI" />
  <title>Андрій AI Помічник</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #0d0a1a;
      color: #f0e9ff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(109,40,217,0.18) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(76,29,149,0.12) 0%, transparent 50%);
    }

    /* HEADER */
    .header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(167,139,250,0.12);
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 16px rgba(167,139,250,0.35);
      flex-shrink: 0;
    }

    .header-title { font-size: 16px; font-weight: 600; color: #f0e9ff; }
    .clear-btn {
      margin-left: auto;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: 10px;
      padding: 6px 10px;
      color: #c4b5fd;
      font-size: 13px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .clear-btn:active { background: rgba(124,58,237,0.3); }
    .header-status {
      font-size: 12px; color: #a78bfa;
      display: flex; align-items: center; gap: 5px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* QUICK BUTTONS */
    .quick-bar {
      padding: 10px 16px;
      display: flex; gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid rgba(167,139,250,0.07);
      scrollbar-width: none;
    }
    .quick-bar::-webkit-scrollbar { display: none; }

    .quick-btn {
      background: rgba(124,58,237,0.15);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: 20px;
      padding: 6px 14px;
      color: #c4b5fd;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      display: flex; align-items: center; gap: 6px;
      transition: background 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .quick-btn:active { background: rgba(124,58,237,0.35); }

    /* MESSAGES */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-row {
      display: flex;
      margin-bottom: 14px;
      animation: fadeUp 0.25s ease;
    }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; margin-right: 8px; flex-shrink: 0; margin-top: 2px;
    }

    .bubble {
      max-width: 78%;
      padding: 11px 15px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      border-radius: 18px 18px 4px 18px;
      box-shadow: 0 3px 12px rgba(109,40,217,0.4);
      color: #f5f0ff;
    }
    .bubble.assistant {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(167,139,250,0.15);
      border-radius: 18px 18px 18px 4px;
      color: #e8e0ff;
      white-space: normal; /* форматуванням керує наш HTML, а не сирі пробіли */
    }

    /* ФОРМАТУВАННЯ ВІДПОВІДЕЙ (Markdown -> красиво) */
    .bubble .md-line { margin: 0; }
    .bubble .md-space { height: 8px; }
    .bubble .md-h { font-weight: 700; line-height: 1.3; margin: 8px 0 2px; }
    .bubble .md-h:first-child { margin-top: 0; }
    .bubble .md-h1 { font-size: 17px; }
    .bubble .md-h2 { font-size: 16px; }
    .bubble .md-h3 { font-size: 15px; color: #c4b5fd; }
    .bubble .md-list { margin: 4px 0; padding-left: 22px; }
    .bubble .md-list li { margin: 2px 0; }
    .bubble strong { font-weight: 700; color: #ffffff; }
    .bubble em { font-style: italic; }
    .bubble a { color: #a78bfa; text-decoration: underline; }
    .bubble .inline-code {
      background: rgba(0,0,0,0.35);
      padding: 1px 5px;
      border-radius: 5px;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      font-size: 0.9em;
    }
    .bubble .code-block {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(167,139,250,0.15);
      border-radius: 10px;
      padding: 10px 12px;
      margin: 8px 0;
      overflow-x: auto;
    }
    .bubble .code-block code {
      display: block;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.5;
      white-space: pre;
      color: #e8e0ff;
    }

    /* TYPING */
    .typing-dots {
      display: flex; gap: 5px; align-items: center;
      padding: 12px 15px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(167,139,250,0.15);
      border-radius: 18px 18px 18px 4px;
    }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #a78bfa;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* INPUT */
    .input-area {
      padding: 10px 16px 24px;
      border-top: 1px solid rgba(167,139,250,0.1);
      background: rgba(255,255,255,0.02);
      display: flex; gap: 10px; align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: 14px;
      padding: 11px 15px;
      color: #f0e9ff;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 120px;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: rgba(167,139,250,0.5); }
    textarea::placeholder { color: rgba(167,139,250,0.4); }

    .send-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      border: none; color: white; font-size: 20px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 12px rgba(124,58,237,0.4);
      transition: opacity 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
    .send-btn:not(:disabled):active { transform: scale(0.92); }

    /* CONFIG BANNER */
    .config-banner {
      margin: 16px; padding: 14px 16px;
      background: rgba(234,179,8,0.1);
      border: 1px solid rgba(234,179,8,0.25);
      border-radius: 12px;
      font-size: 13px;
      color: #fde68a;
      line-height: 1.6;
    }
    .config-banner strong { display: block; margin-bottom: 4px; font-size: 14px; }
    .config-banner code {
      background: rgba(0,0,0,0.3);
      padding: 2px 6px; border-radius: 4px;
      font-family: monospace; font-size: 12px;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="avatar">✦</div>
  <div>
    <div class="header-title">Андрій AI Помічник</div>
    <div class="header-status">
      <span class="dot"></span>
      <span id="status-text">Онлайн</span>
    </div>
  </div>
  <button class="clear-btn" id="clear-btn" onclick="clearChat()" title="Очистити листування">🗑 Очистити</button>
</div>

<!-- QUICK BUTTONS -->
<div class="quick-bar">
  <button class="quick-btn" onclick="quickSend('Допоможи з питанням про FPV дрони та налаштування польотного контролера')">🚁 FPV Дрони</button>
  <button class="quick-btn" onclick="quickSend('Поясни мені концепцію програмування покроково, як для новачка')">💻 Код</button>
  <button class="quick-btn" onclick="quickSend('Допоможи з розробкою або деплоєм мого сайту')">🌐 Сайт</button>
  <button class="quick-btn" onclick="quickSend('Допоможи структурувати задачу покроково')">🎯 Задача</button>
  <button class="quick-btn" onclick="quickSend('Що ти вмієш і як можеш мені допомогти?')">❓ Що вмієш?</button>
</div>

<!-- MESSAGES -->
<div class="messages" id="messages">
  <!-- Config banner — видали після вставки API ключа -->
  <div class="config-banner" id="config-banner">
    <strong>⚙️ Потрібно налаштувати API ключ</strong>
    Відкрий файл <code>index.html</code>, знайди рядок<br>
    <code>const API_KEY = 'YOUR_API_KEY_HERE';</code><br>
    і заміни <code>YOUR_API_KEY_HERE</code> на свій ключ від Anthropic.
  </div>
</div>

<!-- INPUT -->
<div class="input-area">
  <textarea
    id="input"
    placeholder="Напиши своє питання..."
    rows="1"
    onkeydown="handleKey(event)"
    oninput="autoResize(this)"
  ></textarea>
  <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>↑</button>
</div>

<script>
  // ====================================================
  // 🔑 ВСТАВТЕ СВІЙ API КЛЮЧ ТУТ:
  const API_KEY = 'YOUR_API_KEY_HERE';
  // ====================================================

  const SYSTEM = `Ти — персональний AI-помічник Андрія.
Андрій — досвідчений пілот FPV дронів. Знає RadioMaster Boxer, EdgeTX, ExpressLRS.
Він початківець у програмуванні — пояснюй все максимально покроково, просто і детально.
Відповідай тільки українською мовою. Будь дружнім, точним і терплячим.
Якщо питання про дрони — використовуй його досвід як базу.
Якщо питання про код — пояснюй як новачку, крок за кроком з прикладами.`;

  let history = [];
  let isLoading = false;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const statusEl = document.getElementById('status-text');

  // Ключ, під яким чат зберігається у памʼяті телефона/браузера
  const STORAGE_KEY = 'andriy_ai_history_v1';

  // Зберегти листування (щоб воно не зникало після перезавантаження чи збою)
  function saveHistory() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
  }
  // Прочитати збережене листування. Якщо щось не так — повертаємо порожній список.
  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }

  // Не даємо історії розростатися нескінченно (інакше запити стають велетенськими
  // й повільними). Тримаємо останні ~40 повідомлень, прибираючи найстаріші парами
  // (питання+відповідь), щоб порядок ролей не збився.
  const MAX_HISTORY = 40;
  function trimHistory() {
    while (history.length > MAX_HISTORY) history.splice(0, 2);
  }

  // Очистити чат (кнопка 🗑 у шапці)
  function clearChat() {
    history = [];
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    messagesEl.innerHTML = '';
    addMessage('assistant', 'Чат очищено. 🧹 Про що поговоримо?');
  }

  // Запуск застосунку. Загорнуто у try/catch: якщо раптом станеться помилка,
  // покажемо зрозуміле повідомлення, а не порожній ("білий") екран.
  function init() {
    if (API_KEY === 'YOUR_API_KEY_HERE') return; // ключ ще не вставлено — показуємо банер

    document.getElementById('config-banner').style.display = 'none';

    const saved = loadHistory();
    if (saved.length) {
      history = saved;
      for (const m of history) {
        if (m && m.role && typeof m.content === 'string') addMessage(m.role, m.content);
      }
    } else {
      addMessage('assistant', 'Привіт, Андрію! 👋\nЯ твій персональний помічник. Знаю про твої FPV дрони та допоможу з програмуванням покроково.\n\nЩо хочеш зробити сьогодні?');
    }
  }

  try {
    init();
  } catch (e) {
    const banner = document.getElementById('config-banner');
    if (banner) {
      banner.style.display = 'block';
      banner.innerHTML = '<strong>⚠️ Помилка запуску</strong>' +
        'Спробуй натиснути "🗑 Очистити" вгорі. Технічні деталі: ' +
        escapeHtml(String(e && e.message ? e.message : e));
    }
  }

  inputEl.addEventListener('input', () => {
    sendBtn.disabled = !inputEl.value.trim() || isLoading;
  });

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 600) {
      e.preventDefault();
      sendMessage();
    }
  }

  function quickSend(text) {
    if (isLoading) return;
    inputEl.value = text;
    autoResize(inputEl);
    sendMessage();
  }

  // Робить текст безпечним для вставки в HTML (щоб спецсимволи < > & не ламали сторінку
  // і ніхто не міг вставити чужий код).
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Перетворює розмітку Markdown (те, що присилає Claude) на красивий HTML.
  // Порядок важливий: спочатку виймаємо блоки коду, потім усе екрануємо,
  // і лише тоді додаємо форматування — так це залишається безпечним.
  function renderMarkdown(src) {
    const codeBlocks = [];

    // 1) Виймаємо багаторядкові блоки коду ```...``` і ставимо тимчасові мітки
    let text = String(src).replace(/```[^\n]*\n?([\s\S]*?)```/g, (_, code) => {
      const idx = codeBlocks.length;
      codeBlocks.push(code.replace(/\n+$/, ''));
      return '' + idx + '';
    });

    // Форматування всередині одного рядка (жирний, курсив, код, посилання)
    const inline = (s) => {
      s = escapeHtml(s);
      s = s.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>'); // `код`
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');           // **жирний**
      s = s.replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g, '$1<em>$2</em>');       // *курсив*
      s = s.replace(/(^|[^_\w])_(?!\s)([^_]+?)_/g, '$1<em>$2</em>');       // _курсив_
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,              // [текст](посилання)
        '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return s;
    };

    const lines = text.split('\n');
    let html = '';
    let listType = null; // 'ul' (список з крапками) або 'ol' (нумерований)
    const closeList = () => { if (listType) { html += '</' + listType + '>'; listType = null; } };

    for (const raw of lines) {
      const line = raw.replace(/\r$/, '');

      // Мітка блоку коду
      const block = line.match(/^(\d+)$/);
      if (block) {
        closeList();
        html += '<pre class="code-block"><code>' + escapeHtml(codeBlocks[+block[1]]) + '</code></pre>';
        continue;
      }

      // Порожній рядок = невеликий відступ між абзацами
      if (line.trim() === '') { closeList(); if (html) html += '<div class="md-space"></div>'; continue; }

      // Заголовки #, ##, ###
      const h = line.match(/^(#{1,3})\s+(.*)$/);
      if (h) { closeList(); html += '<div class="md-h md-h' + h[1].length + '">' + inline(h[2]) + '</div>'; continue; }

      // Список з крапками:  - пункт  або  * пункт
      const ul = line.match(/^\s*[-*]\s+(.*)$/);
      if (ul) {
        if (listType !== 'ul') { closeList(); html += '<ul class="md-list">'; listType = 'ul'; }
        html += '<li>' + inline(ul[1]) + '</li>';
        continue;
      }

      // Нумерований список:  1. пункт
      const ol = line.match(/^\s*\d+\.\s+(.*)$/);
      if (ol) {
        if (listType !== 'ol') { closeList(); html += '<ol class="md-list">'; listType = 'ol'; }
        html += '<li>' + inline(ol[1]) + '</li>';
        continue;
      }

      // Звичайний рядок тексту
      closeList();
      html += '<div class="md-line">' + inline(line) + '</div>';
    }
    closeList();
    return html;
  }

  function addMessage(role, text) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    if (role === 'assistant') {
      const av = document.createElement('div');
      av.className = 'msg-avatar';
      av.textContent = '✦';
      row.appendChild(av);
    }

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;
    // Повідомлення користувача показуємо як звичайний текст (безпечно).
    // Відповіді помічника — форматуємо (жирний, списки, код тощо).
    if (role === 'assistant') {
      bubble.innerHTML = renderMarkdown(text);
    } else {
      bubble.textContent = text;
    }
    row.appendChild(bubble);

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.id = 'typing-row';

    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.textContent = '✦';

    const dots = document.createElement('div');
    dots.className = 'typing-dots';
    dots.innerHTML = '<span></span><span></span><span></span>';

    row.appendChild(av);
    row.appendChild(dots);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  async function sendMessage() {
    if (API_KEY === 'YOUR_API_KEY_HERE') {
      alert('Спочатку встав API ключ у файлі index.html!');
      return;
    }

    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    inputEl.value = '';
    autoResize(inputEl);
    sendBtn.disabled = true;
    isLoading = true;
    statusEl.textContent = 'Друкує...';

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    saveHistory();

    showTyping();

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': API_KEY,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1024,
          system: SYSTEM,
          messages: history,
        }),
      });

      const data = await res.json();
      removeTyping();

      if (data.content?.[0]?.text) {
        const reply = data.content[0].text;
        history.push({ role: 'assistant', content: reply });
        trimHistory();
        saveHistory();
        addMessage('assistant', reply);
      } else {
        addMessage('assistant', '❌ Помилка: ' + (data.error?.message || 'Невідома помилка'));
      }
    } catch (err) {
      removeTyping();
      addMessage('assistant', '❌ Помилка з\'єднання. Перевір інтернет та API ключ.');
    }

    isLoading = false;
    statusEl.textContent = 'Онлайн';
    inputEl.focus();
  }
</script>
</body>
</html>
